<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Curiosidades sobre Tecnologia</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="container">

        <div class="icone">💻</div>

        <h1>Curiosidades sobre Tecnologia</h1>

        <p class="subtitulo">
            Clique no botão para descobrir uma curiosidade tecnológica!
        </p>

        <section class="card">
            <p class="mensagem">
                Sua curiosidade aparecerá aqui.
            </p>
        </section>

        <button class="botao">
            🚀 Mostrar curiosidade
        </button>

        <p class="contador">
            Curiosidades descobertas: <span id="contador">0</span>
        </p>

    </main>

    <script src="script.js"></script>
</body>
</html>
